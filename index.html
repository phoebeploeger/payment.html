<!DOCTYPE html>
<html>
<head>
<title>Loan Payment Calculator</title>
</head>
<body>

<h1>Loan Payment Calculator.</h1>
<p> Amount Loan <input id= "loanAmount"> <br>
Annual Interest Rate <input id="interestRate"> <br>
The Year <input id="years"> <br>
<button onclick="calculatePayment()"> calculatePayment </button>

</p>
<p>
  Your Answer <span id="ans"> _______ </span></p>

<script> 
function calculatePayment() {
    // Get input values
    let PV = parseFloat(document.getElementById("loanAmount").value);
    let r = parseFloat(document.getElementById("interestRate").value);
    let n = parseFloat(document.getElementById("years").value);

    // Validate inputs
    if (isNaN(PV) || isNaN(r) || isNaN(n) || PV <= 0 || r <= 0 || n <= 0) {
        alert("Please enter valid values.");
        return;
    }

    // Monthly payment formula
    let P = ((r / 100 / 12) * PV) /
            (1 - (1 + (r / 100 / 12)) ** -(n * 12));

    // Display result
    document.getElementById("ans").textContent = "If you take a loan 1000"+ PV + "for 6 years"+ r + "at 4 interest"+ n + "your payment will be $" P.toFixed(2): 
}


</script> 

</body>
</html>
